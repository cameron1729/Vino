[package]
name = "vino-gpu-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline Ella codec correctness and CPU/Vulkan efficiency experiment"

[features]
live = ["vino-chimera/live", "vino-chimera/revdi"]

[dependencies]
anyhow = "1"
ash = "0.38"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vino-chimera = { path = "../chimera" }

[[bin]]
name = "vino-gpu"
path = "src/main.rs"

[[bin]]
name = "vino-gpu-live"
path = "src/live.rs"
required-features = ["live"]
